name: Update flake.lock

on:
  schedule:
    # 09:00 UTC nightly — early morning in the US, so a fresh lock is already
    # on main by the time anything runs `hms`.
    - cron: "0 9 * * *"
  workflow_dispatch:

# Never let two updates race for a push to main.
concurrency:
  group: update-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update and validate inputs
        run: ./.github/scripts/update-lock.sh

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F - -- flake.lock <<EOF
          Updating flake.lock

          $(cat .update-log)
          EOF
          git push origin HEAD:main
