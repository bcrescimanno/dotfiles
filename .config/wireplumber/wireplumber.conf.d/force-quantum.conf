# Pin the graph quantum for the Generic USB Audio card.
#
# Its S/PDIF device latches running-but-silent if the graph quantum is
# renegotiated while the PCM is mid-stream: links stay active, the clock keeps
# advancing, xruns stay at zero, and nothing comes out. Only a PCM reopen
# clears it. EverQuest Legends (eqgame.exe) requests node.latency = 256/48000
# on four streams at once, which drags the graph from 1024 down to 256 and
# trips exactly that race. disable-suspension.conf makes it worse by design:
# with session.suspend-timeout-seconds = 0 the PCM never closes, so every
# renegotiation lands on a live stream.
#
# Forcing the quantum on the sink (the driver node) fixes the graph at 512 and
# makes client node.latency requests unable to move it. 512 = ~10.7ms; raise to
# 1024 for more headroom or drop to 256 for lower latency -- the value does not
# matter to the bug, only that it stops changing.
#
# Scoped to this card so the Scarlett can still renegotiate freely.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Generic_USB_Audio.*"
      }
    ]
    actions = {
      update-props = {
        node.force-quantum = 512
      }
    }
  }
]
