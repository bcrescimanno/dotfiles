# The Scarlett 16i16 shows up as one 18-channel source with unlabelled
# AUX0..AUX17 channels, which apps can't map to a mic — they get whatever
# downmix PipeWire guesses. This exposes the SM7B (Analogue 1, routed to the
# Scarlett's PCM capture 1 = AUX0 in the device mixer) as a plain mono source.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "SM7B (Scarlett In 1)"
      capture.props = {
        node.name = "capture.scarlett_sm7b"
        audio.position = [ AUX0 ]
        stream.dont-remix = true
        target.object = "alsa_input.usb-Focusrite_Scarlett_16i16_4th_Gen_S6A033H4901FD4-00.multichannel-input"
        node.passive = true
      }
      playback.props = {
        node.name = "scarlett_sm7b"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
      }
    }
  }
]
